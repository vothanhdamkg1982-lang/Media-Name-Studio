<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Name Studio</title>
    <!-- Thư viện ngoài -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Font & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1><i class="fa-solid fa-camera-retro"></i> MEDIA NAME STUDIO</h1>
        <div class="current-student-display" id="headerStudentName">Chưa chọn học sinh</div>
    </header>

    <main class="app-main">
        <!-- TAB: CAMERA -->
        <section id="tab-camera" class="tab-content active">
            <div class="camera-container">
                <video id="rawVideo" autoplay playsinline muted style="display: none;"></video>
                <canvas id="outputCanvas"></canvas>
                <div id="recordingIndicator" class="recording-indicator hidden">
                    <span class="dot"></span> REC <span id="recordingTime">00:00</span>
                </div>
            </div>
            
            <div class="camera-controls">
                <div class="control-row">
                    <button class="btn icon-btn" id="btnSwitchCamera"><i class="fa-solid fa-rotate"></i></button>
                    <button class="btn btn-primary btn-large" id="btnCapturePhoto"><i class="fa-solid fa-camera"></i> CHỤP</button>
                    <button class="btn btn-danger btn-large" id="btnRecordVideo"><i class="fa-solid fa-video"></i> QUAY</button>
                </div>
            </div>
        </section>

        <!-- TAB: LIST -->
        <section id="tab-list" class="tab-content">
            <div class="panel">
                <h2>Quản lý danh sách</h2>
                <div class="list-actions">
                    <label for="excelUpload" class="btn btn-secondary">
                        <i class="fa-solid fa-file-excel"></i> Import Excel
                    </label>
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" hidden>
                    <!-- THÊM NÚT TẢI FILE MẪU Ở ĐÂY -->
                    <button class="btn btn-primary" id="btnDownloadSample" title="Tải file Excel mẫu">
                        <i class="fa-solid fa-download"></i> File mẫu
                    </button>
                    <button class="btn btn-danger" id="btnClearList"><i class="fa-solid fa-trash"></i> Xóa DS</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchStudent" placeholder="🔍 Tìm kiếm học sinh...">
                </div>
                <div class="add-manual">
                    <input type="text" id="manualName" placeholder="Nhập tên thủ công...">
                    <button class="btn btn-primary" id="btnAddManual"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="studentList" class="data-list">
                    <!-- Sinh tự động -->
                </ul>
            </div>
        </section>

        <!-- TAB: GALLERY -->
        <section id="tab-gallery" class="tab-content">
            <div class="panel">
                <h2>Thư viện Media</h2>
                <div class="gallery-controls">
                    <select id="filterType" class="form-control">
                        <option value="all">Tất cả</option>
                        <option value="photo">Chỉ Ảnh</option>
                        <option value="video">Chỉ Video</option>
                    </select>
                    <button class="btn btn-primary" id="btnExportSelected"><i class="fa-solid fa-file-zipper"></i> Xuất ZIP</button>
                    <button class="btn btn-danger" id="btnDeleteSelected"><i class="fa-solid fa-trash"></i> Xóa</button>
                </div>
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Sinh tự động -->
                </div>
            </div>
        </section>

        <!-- TAB: SETTINGS -->
        <section id="tab-settings" class="tab-content">
            <div class="panel">
                <h2>Cài đặt Watermark</h2>
                <div class="form-group">
                    <label>Tên hiển thị (Đơn vị/Trường):</label>
                    <input type="text" id="setUnitName" class="form-control">
                </div>
                <div class="form-group">
                    <label>Hiển thị:</label>
                    <label><input type="checkbox" id="setShowUnit"> Hiện tên đơn vị</label><br>
                    <label><input type="checkbox" id="setShowDate"> Hiện ngày giờ</label>
                </div>
                <div class="form-group">
                    <label>Vị trí:</label>
                    <select id="setPosition" class="form-control">
                        <option value="top">Phía trên</option>
                        <option value="bottom">Phía dưới</option>
                        <option value="center">Ở giữa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Căn chỉnh:</label>
                    <select id="setAlign" class="form-control">
                        <option value="left">Trái</option>
                        <option value="center">Giữa</option>
                        <option value="right">Phải</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cỡ chữ (px):</label>
                    <input type="number" id="setFontSize" class="form-control" value="40">
                </div>
                <div class="form-group">
                    <label>Màu chữ:</label>
                    <input type="color" id="setColor" class="form-control" value="#ffffff">
                </div>
                <div class="form-group">
                    <label>Màu nền & Độ trong suốt (RGBA):</label>
                    <input type="text" id="setBgColor" class="form-control" value="rgba(0,0,0,0.5)">
                </div>
                <button id="btnSaveSettings" class="btn btn-primary" style="width: 100%; padding: 15px; margin-top: 20px; cursor: pointer;">
        <i class="fa-solid fa-save"></i> LƯU CẤU HÌNH
    </button>
                <button class="btn btn-primary w-100" id="btnSaveSettings"><i class="fa-solid fa-save"></i> Lưu Cài Đặt</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-camera"><i class="fa-solid fa-camera"></i> Camera</button>
        <button class="nav-btn" data-target="tab-list"><i class="fa-solid fa-list"></i> Danh sách</button>
        <button class="nav-btn" data-target="tab-gallery"><i class="fa-solid fa-images"></i> Thư viện</button>
        <button class="nav-btn" data-target="tab-settings"><i class="fa-solid fa-gear"></i> Cài đặt</button>
    </nav>
    
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
    <script src="script.js"></script>
    <!-- Modal xem ảnh -->
<div id="imageModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); align-items:center; justify-content:center;">
    <span onclick="document.getElementById('imageModal').style.display='none'" style="position:absolute; top:20px; right:30px; color:#fff; font-size:40px; cursor:pointer;">&times;</span>
    <img id="modalImg" style="max-width:90%; max-height:80%; border:2px solid #fff;">
    <div id="modalCaption" style="color:#fff; text-align:center; margin-top:10px;"></div>
</div>
</body>
</html>

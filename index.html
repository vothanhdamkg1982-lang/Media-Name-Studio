<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEDIA NAME STUDIO</title>

    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Thư viện xử lý Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Thư viện nén ZIP và lưu file -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Font & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <h1><i class="fa-solid fa-camera-retro"></i> MEDIA NAME STUDIO</h1>
        <div class="current-student-display" id="headerStudentName">Chưa chọn học sinh</div>
    </header>

    <!-- AUTH CONTAINER -->
    <div id="authContainer" class="auth-container">
        <div id="userInfo" class="user-info" style="display: none;">
            <span><i class="fa-solid fa-user-circle"></i> <strong id="userEmail"></strong></span>
            <button id="btnLogout" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </div>
        <div id="loginSection" class="login-section">
            <button id="btnLoginGoogle" class="btn btn-google">
                <i class="fa-brands fa-google"></i> Đăng nhập Google để đồng bộ
            </button>
        </div>
    </div>

    <!-- MAIN APP TABS -->
    <main class="app-main">
        <!-- TAB 1: CAMERA -->
        <section id="tab-camera" class="tab-content active">
            <div class="camera-wrapper">
                <div class="camera-top-row">
                    <div class="camera-container">
                        <video id="rawVideo" autoplay playsinline muted style="display: none;"></video>
                        <canvas id="outputCanvas"></canvas>
                        <div id="recordingIndicator" class="recording-indicator hidden">
                            <span class="dot"></span> REC <span id="recordingTime">00:00</span>
                        </div>
                    </div>

                    <!-- BẢNG ĐIỀU KHIỂN ZOOM & ĐỘ SÁNG -->
                    <div class="camera-controls-panel">
                        <div class="control-group">
                            <label for="cameraSelect"><i class="fa-solid fa-video"></i> Chọn Camera:</label>
                            <select id="cameraSelect">
                                <option value="">-- Mặc định hệ thống --</option>
                            </select>
                        </div>    
                        <div class="control-group inline">
                            <label><i class="fa-solid fa-magnifying-glass"></i> Zoom:</label>
                            <input type="range" id="zoomRange" min="1" max="3" step="0.1" value="1">
                        </div>
                        <div class="control-group inline">
                            <label><i class="fa-solid fa-sun"></i> Sáng:</label>
                            <input type="range" id="brightnessRange" min="0.5" max="2.8" step="0.1" value="1">
                        </div>
                        <button id="btnResetCamera" class="btn btn-secondary w-100">
                            <i class="fa-solid fa-rotate-right"></i> Đặt lại
                        </button>
                    </div>
                </div>

                <!-- CÁC NÚT CAMERA -->
                <div class="camera-action-buttons">
                    <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" style="display: none;">
                    <button type="button" class="btn btn-success" id="btnNativeCamera">
                        <i class="fa-solid fa-camera-retro"></i> Camera gốc
                    </button>
                    <button class="btn btn-secondary" id="btnSwitchCamera" title="Đổi camera">
                        <i class="fa-solid fa-rotate"></i> Đổi Cam
                    </button>
                    <button class="btn btn-primary" id="btnCapturePhoto"><i class="fa-solid fa-camera"></i> CHỤP</button>
                    <button class="btn btn-danger" id="btnRecordVideo"><i class="fa-solid fa-video"></i> QUAY</button>
                </div>
            </div>
        </section>

        <!-- TAB 2: LIST -->
        <section id="tab-list" class="tab-content">
            <div class="panel">
                <h2>Quản lý danh sách học sinh</h2>
                <div class="list-actions">
                    <label for="excelUpload" class="btn btn-secondary">
                        <i class="fa-solid fa-file-excel"></i> Import Excel
                    </label>
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" hidden>
                    <button class="btn btn-primary" id="btnDownloadSample" title="Tải file Excel mẫu">
                        <i class="fa-solid fa-download"></i> File mẫu
                    </button>
                    <button class="btn btn-danger" id="btnClearList"><i class="fa-solid fa-trash"></i> Xóa DS</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchStudent" placeholder="🔍 Tìm kiếm học sinh...">
                </div>
                <div class="add-manual">
                    <input type="text" id="manualName" placeholder="Nhập tên thủ công...">
                    <button class="btn btn-primary" id="btnAddManual"><i class="fa-solid fa-plus"></i> Thêm</button>
                </div>
                <ul id="studentList" class="data-list"></ul>
            </div>
        </section>

        <!-- TAB 3: GALLERY -->
        <section id="tab-gallery" class="tab-content">
            <div class="panel">
                <h2>Thư viện Media</h2>
                <div class="gallery-controls">
                    <select id="filterType" class="form-control select-inline">
                        <option value="all">Tất cả</option>
                        <option value="photo">Chỉ Ảnh</option>
                        <option value="video">Chỉ Video</option>
                    </select>
                    <button class="btn btn-secondary" id="btnSelectAllMedia"><i class="fa-solid fa-check-double"></i> Chọn tất cả</button>
                    <button class="btn btn-primary" id="btnExportSelected"><i class="fa-solid fa-file-zipper"></i> Xuất ZIP</button>
                    <button class="btn btn-danger" id="btnDeleteSelected"><i class="fa-solid fa-trash"></i> Xóa chọn</button>
                </div>
                <div class="gallery-grid" id="galleryGrid"></div>
            </div>
        </section>

        <!-- TAB 4: SETTINGS -->
        <section id="tab-settings" class="tab-content">
            <div class="panel">
                <h2>Cài đặt Watermark</h2>
                <div class="form-group checkbox-group highlight-box">
                    <label>
                        <input type="checkbox" id="settingWatermark"> In tên và ngày chụp vào ảnh
                    </label>
                </div>
                <div id="watermarkSettingsOptions" style="display: none;">
                    <div class="form-group">
                        <label for="setUnitName">Tên đơn vị / Trường học:</label>
                        <input type="text" id="setUnitName" class="form-control">
                    </div>
                    <div class="form-group checkbox-group">
                        <label><input type="checkbox" id="setShowUnit"> Hiển thị tên đơn vị</label>
                        <label><input type="checkbox" id="setShowDate"> Hiển thị ngày giờ thực</label>
                    </div>
                    <div class="form-group">
                        <label for="setPosition">Vị trí Watermark:</label>
                        <select id="setPosition" class="form-control">
                            <option value="top">Phía trên</option>
                            <option value="bottom">Phía dưới</option>
                            <option value="center">Ở giữa</option>
                            <option value="bottom-right">Góc phải dưới (Chuẩn)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setAlign">Căn chỉnh chữ:</label>
                        <select id="setAlign" class="form-control">
                            <option value="left">Căn trái</option>
                            <option value="center">Căn giữa</option>
                            <option value="right">Căn phải</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setFontSize">Cỡ chữ (px):</label>
                        <input type="number" id="setFontSize" class="form-control" value="12" min="10" max="100">
                    </div>
                    <div class="form-group">
                        <label for="setColor">Màu chữ:</label>
                        <input type="color" id="setColor" class="form-control color-picker" value="#ff2407">
                    </div>
                    <div class="form-group">
                        <label for="setBgColor">Màu nền hộp chữ (từ khóa hoặc HEX/RGBA):</label>
                        <input type="text" id="setBgColor" class="form-control" value="transparent">
                    </div>
                </div>
                <button id="btnSaveSettings" class="btn btn-primary w-100 btn-large mt-3">
                    <i class="fa-solid fa-floppy-disk"></i> LƯU CẤU HÌNH
                </button>
            </div>
        </section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-camera"><i class="fa-solid fa-camera"></i> Camera</button>
        <button class="nav-btn" data-target="tab-list"><i class="fa-solid fa-list-check"></i> Danh sách</button>
        <button class="nav-btn" data-target="tab-gallery"><i class="fa-solid fa-images"></i> Thư viện</button>
        <button class="nav-btn" data-target="tab-settings"><i class="fa-solid fa-sliders"></i> Cài đặt</button>
    </nav>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast hidden"></div>

    <!-- MODALS -->
    <div id="imageModal" class="modal hidden">
        <span class="modal-close" id="closeImageModal">&times;</span>
        <img id="modalImg" class="modal-content" alt="Preview Image">
        <div id="modalCaption" class="modal-caption"></div>
    </div>
    <div id="videoModal" class="modal hidden">
        <span class="modal-close" id="closeVideoModal">&times;</span>
        <video id="modalVideo" class="modal-content" controls></video>
        <div id="modalVideoCaption" class="modal-caption"></div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script src="script.js"></script>
</body>
</html>
